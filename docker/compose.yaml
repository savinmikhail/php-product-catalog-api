services:
  app:
    build:
      context: ../app
      dockerfile: ../docker/php/Dockerfile
    env_file:
      - ../.env
    environment:
      APP_ENV: ${APP_ENV:-dev}
      APP_DEBUG: ${APP_DEBUG:-0}
      DB_HOST: ${DB_HOST:-mysql}
      DB_PORT: ${DB_PORT:-3306}
      DB_DATABASE: ${DB_DATABASE:-catalog}
      DB_USERNAME: ${DB_USERNAME:-catalog}
      DB_PASSWORD: ${DB_PASSWORD:-catalog}
      DADATA_API_URL: ${DADATA_API_URL:-https://suggestions.dadata.ru/suggestions/api/4_1/rs/suggest/party}
      DADATA_API_TOKEN: ${DADATA_API_TOKEN:-}
      DADATA_HTTP_TIMEOUT: ${DADATA_HTTP_TIMEOUT:-3}
      DADATA_INN_CACHE_TTL: ${DADATA_INN_CACHE_TTL:-3600}
      ELASTICSEARCH_URL: ${ELASTICSEARCH_URL:-http://elasticsearch:9200}
      ELASTICSEARCH_INDEX: ${ELASTICSEARCH_INDEX:-products}
      ELASTICSEARCH_TIMEOUT: ${ELASTICSEARCH_TIMEOUT:-5}
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - ../app:/var/www/html

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "${APP_PORT:-8080}:80"
    volumes:
      - ../app:/var/www/html:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-catalog}
      MYSQL_USER: ${DB_USERNAME:-catalog}
      MYSQL_PASSWORD: ${DB_PASSWORD:-catalog}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
    ports:
      - "${DB_FORWARD_PORT:-3307}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ../app/database/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u${DB_USERNAME:-catalog}", "-p${DB_PASSWORD:-catalog}"]
      interval: 5s
      timeout: 5s
      retries: 20

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.3
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports:
      - "${ELASTICSEARCH_FORWARD_PORT:-9200}:9200"
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data

volumes:
  mysql-data:
  elasticsearch-data:
